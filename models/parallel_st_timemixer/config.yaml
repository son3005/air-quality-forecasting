# ═══════════════════════════════════════════════════════════
# Parallel v2: STMixer (Parallel Fusion + Gating) Configuration
# ═══════════════════════════════════════════════════════════

model:
  num_nodes:      12
  seq_len:        72          # Lookback window (72h = 3 days)
  pred_len:       12          # Forecast horizon
  num_features:   52          # Auto-corrected at runtime if mismatch
  num_targets:    2           # Multi-target (PM2.5, AQI)
  d_model:        128         # Hidden dim
  d_ff:           512         # MLP expansion
  dropout:        0.15        # Regularization

  # --- TimeMixer Branch ---
  scales:         [1, 4, 24]  # Downsampling scales (1h, 4h, 24h)
  decomp_kernel:  25          # Moving Average kernel

  # --- STGCN Branch ---
  K_cheby:        3           # Chebyshev polynomial order
  num_st_layers:  2           # Number of ST blocks

  # --- Adaptive Graph ---
  adaptive_adj:   True

# ═══════════════════════════════════════════════════════════

graph:
  method: "correlation"
  corr_threshold: 0.3
  distance_sigma: 200
  distance_threshold: 500

training:
  batch_size:     32
  epochs:         150         # Tăng max epochs (WarmRestarts cần chạy lâu hơn)
  lr:             3.0e-4      # Giảm LR (v1 = 5e-4 hội tụ quá nhanh)
  weight_decay:   1.0e-4
  grad_clip:      5.0
  patience:       25          # Tăng patience (WarmRestarts gây oscillation tạm)
  T_max:          50
  eta_min:        1.0e-6
  warmup_epochs:  5

  # Loss params
  loss_alpha:     0.1         # MAE weight
  loss_beta:      0.01        # Entropy Reg weight
  aux_tm_weight:  0.2         # Giảm từ 0.3 → 0.2 (nhánh riêng giờ có decoder riêng)
  aux_st_weight:  0.2

  lambda_pm25:    0.6
  lambda_aqi:     0.4
  huber_delta:    1.0

  aqi_high_weight: 2.0
  aqi_critical_weight: 3.0

split:
  train_end:  "2025-01-31"
  val_end:    "2025-06-30"

provinces:
  - AnGiang
  - CanTho
  - DaNang
  - DongNai
  - HCM
  - HaiPhong
  - Hanoi
  - KhanhHoa
  - NgheAn
  - NinhBinh
  - ThanhHoa
  - VinhLong

paths:
  data:       "data/clean_data_all.csv"
  save_dir:   "results/Parallel_ST-TimeMixer/"
  best_model: "results/Parallel_ST-TimeMixer/best_model_parallel_v2.pt"
